name: Bug report
description: Report broken or regressed behavior in Shurokkha.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove secrets, credentials and personal data from all evidence. Security vulnerabilities must use the Security reporting path instead of this public form.

  - type: dropdown
    id: affected-workspace
    attributes:
      label: Affected area
      options:
        - Web — public experience
        - Web — authentication
        - Web — signed-in app
        - Admin app
        - Docs app
        - UI primitives (`@shurokkha/ui`)
        - UI patterns (`@shurokkha/ui-patterns`)
        - Semantic icons (`@shurokkha/icons`)
        - Other shared package/tooling
        - GitHub automation / repository tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken and what is the impact?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error text when relevant.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Node.js:
        - pnpm:
        - Browser/device:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Sanitized logs, screenshots, recordings, regression commit or workaround.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
        - label: I removed secrets, credentials and personal data from this report.
          required: true
